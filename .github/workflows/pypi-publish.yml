# Publish awtoll to PyPI via trusted publishing (OIDC) -- no API token stored.
#
# PREREQUISITE, and it is a one-time human action: a pending publisher must be
# registered on pypi.org for owner=Aitherium, repo=awtoll,
# workflow=pypi-publish.yml, environment=pypi. Until that exists the publish
# step fails with an OIDC error naming the project rather than the missing
# registration, so check there first.
#
# ubuntu-latest is correct HERE and only here: this is a PUBLIC repository, so
# GitHub-hosted minutes are free. The monorepo's own workflows must use the
# self-hosted pool, where hosted runners are billing-dead and a job dies with
# zero steps and no log.
name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The FLOOR this package declares, not the newest available. awtoll
          # shipped a PEP 701 f-string once -- valid on 3.12, a SyntaxError at
          # IMPORT on the 3.10 it promises -- and a 3.12 job would have built
          # and published it perfectly green.
          python-version: "3.10"
      - name: Install package + test tools
        run: |
          pip install build
          pip install -e .
          pip install pytest tiktoken
      - name: Run the test suite before publishing
        run: python -m pytest tests/ -q
      - name: Prove the rules can still fail
        # A meter that cannot demonstrate it still measures is worse than none,
        # and this runs BEFORE an upload that cannot be taken back.
        run: python -m awtoll.selftest
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
